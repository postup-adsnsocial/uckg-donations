name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan the complete Git history
        run: gitleaks git --redact=100 --no-banner --log-opts=--all .

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uckg_donations
          POSTGRES_PASSWORD: uckg
          POSTGRES_USER: uckg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uckg -d uckg_donations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://uckg:uckg@localhost:5432/uckg_donations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:migrations
      - run: pnpm --filter @uckg/database test:tenancy
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uckg_donations
          POSTGRES_PASSWORD: uckg
          POSTGRES_USER: uckg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uckg -d uckg_donations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://uckg:uckg@localhost:5432/uckg_donations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm db:migrate
      - name: Provision generated runtime LOGIN
        shell: bash
        run: |
          runtime_login="uckg_ci_runtime_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          runtime_password="$(openssl rand -hex 24)"
          echo "::add-mask::${runtime_password}"
          RUNTIME_LOGIN="${runtime_login}" RUNTIME_PASSWORD="${runtime_password}" \
            pnpm --filter @uckg/database exec node --input-type=module --eval '
              import { Pool } from "pg";
              const quoteIdentifier = (value) => `"${value.replaceAll(`"`, `""`)}"`;
              const quoteLiteral = (value) => `\u0027${value.replaceAll(`\u0027`, `\u0027\u0027`)}\u0027`;
              const pool = new Pool({ connectionString: process.env.MIGRATION_DATABASE_URL });
              try {
                await pool.query(`CREATE ROLE ${quoteIdentifier(process.env.RUNTIME_LOGIN)} LOGIN PASSWORD ${quoteLiteral(process.env.RUNTIME_PASSWORD)} NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS`);
                await pool.query(`GRANT uckg_runtime TO ${quoteIdentifier(process.env.RUNTIME_LOGIN)}`);
              } finally {
                await pool.end();
              }
            '
          echo "DATABASE_URL=postgresql://${runtime_login}:${runtime_password}@localhost:5432/uckg_donations" >> "${GITHUB_ENV}"
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  visual:
    name: Visual quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm exec playwright install chromium firefox
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-results
          path: test-results/
          retention-days: 14
